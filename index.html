<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Trivia Game</title>
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div id="root" class="min-h-screen flex items-center justify-center"></div>

  <script type="text/babel">
    const questions = [
      {
        question: "Where did the couple first meet?",
        options: ["College", "Coffee Shop", "Mutual Friend", "Online"],
        correct: "College"
      },
      {
        question: "What is the couple's favorite shared hobby?",
        options: ["Hiking", "Cooking", "Traveling", "Gaming"],
        correct: "Traveling"
      },
      {
        question: "What was the destination of their first trip together?",
        options: ["Paris", "New York", "Bali", "Tokyo"],
        correct: "Paris"
      },
      {
        question: "What song did they choose for their first dance?",
        options: ["Perfect by Ed Sheeran", "At Last by Etta James", "Can't Help Falling in Love by Elvis Presley", "All of Me by John Legend"],
        correct: "Can't Help Falling in Love by Elvis Presley"
      }
    ];

    function TriviaGame() {
      const [currentQuestion, setCurrentQuestion] = React.useState(0);
      const [score, setScore] = React.useState(0);
      const [showResult, setShowResult] = React.useState(false);
      const [selectedOption, setSelectedOption] = React.useState(null);

      const handleAnswer = (option) => {
        setSelectedOption(option);
        if (option === questions[currentQuestion].correct) {
          setScore(score + 1);
        }
        setTimeout(() => {
          if (currentQuestion + 1 < questions.length) {
            setCurrentQuestion(currentQuestion + 1);
            setSelectedOption(null);
          } else {
            setShowResult(true);
          }
        }, 1000);
      };

      const restartGame = () => {
        setCurrentQuestion(0);
        setScore(0);
        setShowResult(false);
        setSelectedOption(null);
      };

      return (
        <div className="bg-white p-8 rounded-lg shadow-lg max-w-lg w-full text-center">
          <h1 className="text-3xl font-bold mb-4 text-pink-600">Wedding Trivia Game</h1>
          <p className="text-lg mb-6">Test your knowledge about the happy couple!</p>

          {!showResult ? (
            <div>
              <h2 className="text-xl font-semibold mb-4">
                Question {currentQuestion + 1} of {questions.length}
              </h2>
              <p className="text-lg mb-6">{questions[currentQuestion].question}</p>
              <div className="space-y-4">
                {questions[currentQuestion].options.map((option, index) => (
                  <button
                    key={index}
                    onClick={() => handleAnswer(option)}
                    disabled={selectedOption !== null}
                    className={`w-full py-2 px-4 rounded-lg text-left transition-colors ${
                      selectedOption === option
                        ? option === questions[currentQuestion].correct
                          ? 'bg-green-500 text-white'
                          : 'bg-red-500 text-white'
                        : 'bg-gray-200 hover:bg-gray-300'
                    }`}
                  >
                    {option}
                  </button>
                ))}
              </div>
            </div>
          ) : (
            <div>
              <h2 className="text-2xl font-semibold mb-4">Game Over!</h2>
              <p className="text-lg mb-6">
                You scored {score} out of {questions.length}!
              </p>
              <p className="text-md mb-6">
                {score === questions.length
                  ? "Perfect! You're a true expert on the couple!"
                  : score >= questions.length / 2
                  ? "Great job! You know the couple well!"
                  : "Nice try! Maybe chat with the couple more!"}
              </p>
              <button
                onClick={restartGame}
                className="bg-pink-600 text-white py-2 px-6 rounded-lg hover:bg-pink-700 transition-colors"
              >
                Play Again
              </button>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<TriviaGame />);
  </script>
</body>
</html>
