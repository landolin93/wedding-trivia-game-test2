<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Trivia Game</title>
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-200 font-sans">
  <div id="root" class="min-h-screen flex items-center justify-center"></div>
  <audio id="background-music" loop autoplay>
    <source src="https://landolin93.github.io/wedding-trivia-game-test2/wedding-romantic-182518.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script type="text/babel">
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD-uMdBpQhau_mQRQwtUqDbNqlPR8LVfq4",
      authDomain: "wedding-trivia-test.firebaseapp.com",
      projectId: "wedding-trivia-test",
      storageBucket: "wedding-trivia-test.firebasestorage.app",
      messagingSenderId: "423493222722",
      appId: "1:423493222722:web:0968dce8350c3ee8d4c8db",
      measurementId: "G-LDT4H0GPFG"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 20 wedding-themed questions
    const allQuestions = [
      {
        question: "Where did the couple first meet?",
        options: ["College", "Coffee Shop", "Mutual Friend", "Online"],
        correct: "College"
      },
      {
        question: "What is the couple's favorite shared hobby?",
        options: ["Hiking", "Cooking", "Traveling", "Gaming"],
        correct: "Traveling"
      },
      {
        question: "What was the destination of their first trip together?",
        options: ["Paris", "New York", "Bali", "Tokyo"],
        correct: "Paris"
      },
      {
        question: "What song did they choose for their first dance?",
        options: ["Perfect by Ed Sheeran", "At Last by Etta James", "Can't Help Falling in Love by Elvis Presley", "All of Me by John Legend"],
        correct: "Can't Help Falling in Love by Elvis Presley"
      },
      {
        question: "What is the couple’s favorite dessert to share?",
        options: ["Chocolate Cake", "Ice Cream", "Cheesecake", "Tiramisu"],
        correct: "Cheesecake"
      },
      {
        question: "Where was their first date?",
        options: ["Movie Theater", "Restaurant", "Park", "Beach"],
        correct: "Restaurant"
      },
      {
        question: "What pet does the couple own together?",
        options: ["Dog", "Cat", "Fish", "None"],
        correct: "Dog"
      },
      {
        question: "What is the couple’s favorite movie to watch together?",
        options: ["The Notebook", "Inception", "La La Land", "Star Wars"],
        correct: "La La Land"
      },
      {
        question: "What season did the couple get engaged in?",
        options: ["Spring", "Summer", "Fall", "Winter"],
        correct: "Fall"
      },
      {
        question: "What is the couple’s favorite weekend activity?",
        options: ["Brunch", "Hiking", "Movie Night", "Shopping"],
        correct: "Brunch"
      },
      {
        question: "What color is the couple’s wedding theme?",
        options: ["Blue", "Pink", "Gold", "Green"],
        correct: "Pink"
      },
      {
        question: "What instrument does one of the couple play?",
        options: ["Guitar", "Piano", "Violin", "None"],
        correct: "Piano"
      },
      {
        question: "What is the couple’s favorite holiday?",
        options: ["Christmas", "Halloween", "Thanksgiving", "Valentine’s Day"],
        correct: "Christmas"
      },
      {
        question: "Where did the couple get engaged?",
        options: ["Beach", "Mountain", "City Park", "Restaurant"],
        correct: "Beach"
      },
      {
        question: "What is the couple’s favorite board game?",
        options: ["Monopoly", "Scrabble", "Catan", "Chess"],
        correct: "Scrabble"
      },
      {
        question: "What type of cuisine do they love most?",
        options: ["Italian", "Mexican", "Japanese", "Indian"],
        correct: "Italian"
      },
      {
        question: "What was the couple’s first concert together?",
        options: ["Coldplay", "Beyoncé", "The Beatles Tribute", "Local Band"],
        correct: "Coldplay"
      },
      {
        question: "What is the couple’s dream vacation spot?",
        options: ["Maldives", "Italy", "Australia", "Canada"],
        correct: "Italy"
      },
      {
        question: "What sport do they enjoy watching together?",
        options: ["Football", "Basketball", "Tennis", "None"],
        correct: "Tennis"
      },
      {
        question: "What is the couple’s favorite coffee order?",
        options: ["Latte", "Cappuccino", "Black Coffee", "Mocha"],
        correct: "Latte"
      }
    ];

    // Fisher-Yates shuffle
    function shuffle(array) {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    }

    function TriviaGame() {
      const [gameState, setGameState] = React.useState('mainMenu');
      const [firstName, setFirstName] = React.useState('');
      const [lastName, setLastName] = React.useState('');
      const [gameMode, setGameMode] = React.useState(null);
      const [currentQuestion, setCurrentQuestion] = React.useState(0);
      const [score, setScore] = React.useState(0);
      const [selectedOption, setSelectedOption] = React.useState(null);
      const [questions, setQuestions] = React.useState([]);
      const [shuffledOptions, setShuffledOptions] = React.useState([]);
      const [timer, setTimer] = React.useState(20);
      const [answered, setAnswered] = React.useState(false);
      const [totalTime, setTotalTime] = React.useState(0);
      const [miniLeaderboard, setMiniLeaderboard] = React.useState([]);
      const [fullLeaderboard, setFullLeaderboard] = React.useState([]);
      const [leaderboardType, setLeaderboardType] = React.useState('mini');
      const [leaderboardView, setLeaderboardView] = React.useState('top5');
      const [leaderboardError, setLeaderboardError] = React.useState(null);
      const [isLoading, setIsLoading] = React.useState(true);
      const [questionStartTime, setQuestionStartTime] = React.useState(null);
      const [muted, setMuted] = React.useState(false);
      const [darkMode, setDarkMode] = React.useState(false);

      // Toggle dark mode classes
      React.useEffect(() => {
        const body = document.body;
        const root = document.getElementById('root').firstChild;
        if (darkMode) {
          body.classList.add('bg-gray-700');
          body.classList.remove('bg-gray-200');
          root.classList.add('bg-gray-800', 'text-gray-100');
          root.classList.remove('bg-white', 'text-gray-900');
        } else {
          body.classList.add('bg-gray-200');
          body.classList.remove('bg-gray-700');
          root.classList.add('bg-white', 'text-gray-900');
          root.classList.remove('bg-gray-800', 'text-gray-100');
        }
        console.log('Dark mode:', darkMode, 'Body Classes:', body.classList, 'Root Classes:', root.classList);
      }, [darkMode]);

      // Control background music
      React.useEffect(() => {
        const audio = document.getElementById('background-music');
        audio.volume = 0.2;
        audio.muted = muted;
        audio.play().catch(error => {
          console.log('Autoplay prevented:', error);
          const handleInteraction = () => {
            audio.play();
            document.removeEventListener('click', handleInteraction);
          };
          document.addEventListener('click', handleInteraction);
        });
      }, [muted]);

      // Sync leaderboardType with gameState
      React.useEffect(() => {
        if (gameState === 'miniLeaderboard') {
          setLeaderboardType('mini');
        } else if (gameState === 'fullLeaderboard') {
          setLeaderboardType('full');
        }
      }, [gameState]);

      // Fetch leaderboards
      const fetchLeaderboards = async () => {
        setIsLoading(true);
        try {
          const miniSnapshot = await db.collection('miniLeaderboard')
            .orderBy('score', 'desc')
            .orderBy('completionTime', 'asc')
            .get();
          setMiniLeaderboard(miniSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          const fullSnapshot = await db.collection('fullLeaderboard')
            .orderBy('score', 'desc')
            .orderBy('completionTime', 'asc')
            .get();
          setFullLeaderboard(fullSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          setLeaderboardError(null);
        } catch (error) {
          console.error('Error fetching leaderboards:', error);
          setLeaderboardError('Failed to load leaderboards.');
        }
        setIsLoading(false);
      };

      // Fetch leaderboards only when leaderboard screen is selected
      React.useEffect(() => {
        if (['miniLeaderboard', 'fullLeaderboard', 'result'].includes(gameState)) {
          fetchLeaderboards();
        }
      }, [gameState]);

      // Initialize questions and options
      React.useEffect(() => {
        if (gameState === 'playing' && questions.length === 0) {
          const questionCount = gameMode === 'mini' ? 10 : allQuestions.length;
          const shuffledQuestions = shuffle(allQuestions).slice(0, questionCount);
          setQuestions(shuffledQuestions);
          setShuffledOptions(shuffledQuestions.map(q => shuffle(q.options)));
          setQuestionStartTime(performance.now());
        }
      }, [gameState, gameMode, questions]);

      // Timer logic for Mini Game only
      React.useEffect(() => {
        if (gameState === 'playing' && gameMode === 'mini' && !answered && timer > 0) {
          const interval = setInterval(() => {
            setTimer(prev => prev - 1);
          }, 1000);
          return () => clearInterval(interval);
        } else if (gameMode === 'mini' && timer === 0 && !answered) {
          handleTimeout();
        }
      }, [timer, gameState, answered, gameMode]);

      const handleModeSelect = (mode) => {
        setGameMode(mode);
        setGameState('nameInput');
      };

      const handleNameSubmit = (e) => {
        e.preventDefault();
        if (firstName.trim() && lastName.trim()) {
          setCurrentQuestion(0);
          setScore(0);
          setSelectedOption(null);
          setQuestions([]);
          setShuffledOptions([]);
          setTimer(20);
          setAnswered(false);
          setTotalTime(0);
          setQuestionStartTime(null);
          setGameState('playing');
        } else {
          alert('Please enter both first and last name.');
        }
      };

      const handleTimeout = () => {
        const timeSpent = 20;
        setTotalTime(prev => prev + timeSpent);
        if (currentQuestion + 1 < questions.length) {
          setCurrentQuestion(currentQuestion + 1);
          setTimer(20);
          setAnswered(false);
          setSelectedOption(null);
          setQuestionStartTime(performance.now());
        } else {
          saveScoreAndCheckEntries();
          setLeaderboardType(gameMode);
          setLeaderboardView('top5');
          setGameState('result');
        }
      };

      const handleAnswer = (option) => {
        if (gameMode === 'mini' && timer === 0) return;
        setSelectedOption(option);
        setAnswered(true);
        const timeSpent = gameMode === 'mini' ? 20 - timer : (performance.now() - questionStartTime) / 1000;
        setTotalTime(prev => prev + timeSpent);
        if (option === questions[currentQuestion].correct) {
          setScore(score + 1);
        }
        setTimeout(() => {
          if (currentQuestion + 1 < questions.length) {
            setCurrentQuestion(currentQuestion + 1);
            setTimer(gameMode === 'mini' ? 20 : 0);
            setAnswered(false);
            setSelectedOption(null);
            setQuestionStartTime(performance.now());
          } else {
            const finalScore = score + (option === questions[currentQuestion].correct ? 1 : 0);
            saveScoreAndCheckEntries(finalScore);
            setLeaderboardType(gameMode);
            setLeaderboardView('top5');
            setGameState('result');
          }
        }, 1000);
      };

      const saveScoreAndCheckEntries = (finalScore = score) => {
        const leaderboardCollection = gameMode === 'mini' ? 'miniLeaderboard' : 'fullLeaderboard';
        const playerName = `${firstName} ${lastName}`;

        db.collection(leaderboardCollection)
          .add({
            name: playerName,
            score: finalScore,
            completionTime: totalTime + (gameMode === 'mini' ? (20 - timer) : (performance.now() - questionStartTime) / 1000),
          })
          .then(() => {
            db.collection(leaderboardCollection)
              .where('name', '==', playerName)
              .orderBy('score', 'asc')
              .get()
              .then((snapshot) => {
                const entries = snapshot.docs;
                if (entries.length > 2) {
                  db.collection(leaderboardCollection)
                    .doc(entries[0].id)
                    .delete()
                    .catch(error => console.error('Error deleting lowest score:', error));
                }
              })
              .catch(error => console.error('Error checking entries:', error));
          })
          .catch(error => console.error('Error saving score:', error));
      };

      const restartGame = () => {
        setGameState('mainMenu');
        setFirstName('');
        setLastName('');
        setGameMode(null);
        setCurrentQuestion(0);
        setScore(0);
        setSelectedOption(null);
        setQuestions([]);
        setShuffledOptions([]);
        setTimer(20);
        setAnswered(false);
        setTotalTime(0);
        setLeaderboardType('mini');
        setLeaderboardView('top5');
        setLeaderboardError(null);
        setQuestionStartTime(null);
      };

      const renderLeaderboards = React.useCallback(() => {
        const maxEntries = leaderboardView === 'top5' ? 5 : Infinity;
        const leaderboard = leaderboardType === 'mini' ? miniLeaderboard : fullLeaderboard;
        const leaderboardTitle = leaderboardType === 'mini' ? 'Mini Game Leaderboard' : 'Full Game Leaderboard';
        const maxScore = leaderboardType === 'mini' ? 10 : 20;

        const uniqueLeaderboard = Object.values(
          leaderboard.reduce((acc, entry) => {
            if (!acc[entry.name] || entry.score > acc[entry.name].score) {
              acc[entry.name] = entry;
            }
            return acc;
          }, {})
        ).sort((a, b) => b.score - a.score || a.completionTime - b.completionTime);

        return (
          <div>
            <h3 className="text-xl font-semibold mb-4">Current: {leaderboardTitle}</h3>
            {isLoading ? (
              <p className="text-lg mb-6">Loading leaderboard...</p>
            ) : leaderboardError ? (
              <p className="text-lg mb-6 text-red-600">Failed to load leaderboards.</p>
            ) : (
              <ul className="text-lg mb-6 space-y-2">
                {uniqueLeaderboard.length > 0 ? (
                  uniqueLeaderboard.slice(0, maxEntries).map((entry, index) => (
                    <li key={index}>
                      {index + 1}. {entry.name}: {entry.score}/{maxScore}, {Math.round(entry.completionTime)}s
                    </li>
                  ))
                ) : (
                  <li>No scores yet!</li>
                )}
              </ul>
            )}
          </div>
        );
      }, [leaderboardType, leaderboardView, miniLeaderboard, fullLeaderboard, isLoading, leaderboardError]);

      return (
        <div className={`p-8 rounded-lg shadow-lg max-w-lg w-full text-center relative ${darkMode ? 'bg-gray-800 text-gray-100' : 'bg-white text-gray-900'}`}>
          <button
            onClick={() => setMuted(!muted)}
            className="absolute top-4 right-4 text-2xl"
          >
            {muted ? '\u{1F507}' : '\u{1F509}'}
          </button>
          {gameState === 'mainMenu' && (
            <button
              onClick={() => setDarkMode(!darkMode)}
              className="absolute top-4 left-4 text-2xl"
            >
              {darkMode ? '\u{2600}' : '\u{1F319}'}
            </button>
          )}
          {gameState === 'mainMenu' && (
            <div>
              <h1 className="text-3xl font-bold mb-4 text-amber-600">Wedding Trivia Game</h1>
              <p className="text-lg mb-6">Welcome to the trivia game!</p>
              <div className="space-y-4">
                <button
                  onClick={() => setGameState('leaderboardSelect')}
                  className="w-full bg-amber-600 text-white py-2 px-6 rounded-lg hover:bg-amber-700 transition-colors"
                >
                  View Leaderboard
                </button>
                <button
                  onClick={() => setGameState('playGame')}
                  className="w-full bg-amber-600 text-white py-2 px-6 rounded-lg hover:bg-amber-700 transition-colors"
                >
                  Play Game
                </button>
              </div>
            </div>
          )}

          {gameState === 'leaderboardSelect' && (
            <div>
              <h1 className="text-3xl font-bold mb-4 text-amber-600">Leaderboards</h1>
              <p className="text-lg mb-6">Select a leaderboard to view</p>
              <div className="space-y-4 mb-6">
                <button
                  onClick={() => setGameState('miniLeaderboard')}
                  className="w-full bg-amber-600 text-white py-2 px-6 rounded-lg hover:bg-amber-700 transition-colors"
                >
                  Mini Game Leaderboard
                </button>
                <button
                  onClick={() => setGameState('fullLeaderboard')}
                  className="w-full bg-amber-600 text-white py-2 px-6 rounded-lg hover:bg-amber-700 transition-colors"
                >
                  Full Game Leaderboard
                </button>
              </div>
              <button
                onClick={() => setGameState('mainMenu')}
                className={`w-full py-2 px-6 rounded-lg transition-colors ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`}
              >
                🪴 Back to Main Menu
              </button>
            </div>
          )}

          {(gameState === 'miniLeaderboard' || gameState === 'fullLeaderboard') && (
            <div>
              <h1 className="text-3xl font-bold mb-4 text-amber-600">
                {gameState === 'miniLeaderboard' ? 'Mini Game Leaderboard' : 'Full Game Leaderboard'}
              </h1>
              <div className="space-y-4 mb-6">
                <div className="space-x-4">
                  <button
                    onClick={() => setLeaderboardView('top5')}
                    className={`py-2 px-4 rounded-lg ${leaderboardView === 'top5' ? 'bg-amber-600 text-white' : (darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300')}`}
                  >
                    Top 5
                  </button>
                  <button
                    onClick={() => setLeaderboardView('all')}
                    className={`py-2 px-4 rounded-lg ${leaderboardView === 'all' ? 'bg-amber-600 text-white' : (darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300')}`}
                  >
                    All
                  </button>
                </div>
                <button
                  onClick={() => setGameState('leaderboardSelect')}
                  className={`w-full py-2 px-6 rounded-lg transition-colors ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`}
                >
                  Back to Leaderboard Selection
                </button>
              </div>
              {renderLeaderboards()}
              <button
                onClick={() => setGameState('mainMenu')}
                className={`w-full py-2 px-6 rounded-lg transition-colors ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`}
              >
                🪴 Back to Main Menu
              </button>
            </div>
          )}

          {gameState === 'playGame' && (
            <div>
              <h1 className="text-3xl font-bold mb-4 text-amber-600">Play Game</h1>
              <p className="text-lg mb-6">Choose a game mode</p>
              <div className="space-y-4">
                <button
                  onClick={() => handleModeSelect('mini')}
                  className="w-full bg-amber-600 text-white py-2 px-6 rounded-lg hover:bg-amber-700 transition-colors"
                >
                  Play Mini Game (10 Questions, 20s Timer)
                </button>
                <button
                  onClick={() => handleModeSelect('full')}
                  className="w-full bg-amber-600 text-white py-2 px-6 rounded-lg hover:bg-amber-700 transition-colors"
                >
                  Play Full Game (20 Questions, No Timer)
                </button>
              </div>
              <button
                onClick={() => setGameState('mainMenu')}
                className={`w-full py-2 px-6 rounded-lg transition-colors ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`}
              >
                🪴 Back to Main Menu
              </button>
            </div>
          )}

          {gameState === 'nameInput' && (
            <div>
              <h1 className="text-3xl font-bold mb-4 text-amber-600">Wedding Trivia Game</h1>
              <p className="text-lg mb-6">Enter your name to start the {gameMode === 'mini' ? 'Mini' : 'Full'} Game!</p>
              <form onSubmit={handleNameSubmit} className="space-y-4">
                <input
                  type="text"
                  placeholder="First Name"
                  value={firstName}
                  onChange={(e) => setFirstName(e.target.value)}
                  className={`w-full p-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-gray-100' : 'bg-white text-gray-900'}`}
                  required
                />
                <input
                  type="text"
                  placeholder="Last Name"
                  value={lastName}
                  onChange={(e) => setLastName(e.target.value)}
                  className={`w-full p-2 border rounded-lg ${darkMode ? 'bg-gray-700 text-gray-100' : 'bg-white text-gray-900'}`}
                  required
                />
                <button
                  type="submit"
                  className="w-full bg-amber-600 text-white py-2 px-6 rounded-lg hover:bg-amber-700 transition-colors"
                >
                  Start Game
                </button>
                <button
                  onClick={() => setGameState('playGame')}
                  className={`w-full py-2 px-6 rounded-lg transition-colors ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`}
                >
                  Back to Play Game
                </button>
              </form>
              <button
                onClick={() => setGameState('mainMenu')}
                className={`w-full py-2 px-6 rounded-lg transition-colors ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`}
              >
                🪴 Back to Main Menu
              </button>
            </div>
          )}

          {gameState === 'playing' && questions.length > 0 && (
            <div>
              <h1 className="text-3xl font-bold mb-4 text-amber-600">Wedding Trivia Game</h1>
              <p className="text-lg mb-6">Welcome, {firstName} {lastName}!</p>
              {gameMode === 'mini' && (
                <p className="text-md mb-4 text-red-600">Time left: {timer}s</p>
              )}
              <h2 className="text-xl font-semibold mb-4">
                Question {currentQuestion + 1} of {questions.length}
              </h2>
              <p className="text-lg mb-6">{questions[currentQuestion].question}</p>
              <div className="space-y-4">
                {shuffledOptions[currentQuestion]?.map((option, index) => (
                  <button
                    key={index}
                    onClick={() => handleAnswer(option)}
                    disabled={selectedOption !== null || answered || (gameMode === 'mini' && timer === 0)}
                    className={`w-full py-2 px-4 rounded-lg text-left transition-colors ${darkMode ? 'bg-gray-700 hover:bg-gray-600 disabled:bg-gray-700' : 'bg-gray-200 hover:bg-gray-300 disabled:bg-gray-200'} disabled:cursor-not-allowed`}
                  >
                    {option}
                  </button>
                ))}
              </div>
            </div>
          )}

          {gameState === 'result' && (
            <div>
              <h2 className="text-2xl font-semibold mb-4">Game Over, {firstName} {lastName}!</h2>
              <p className="text-lg mb-6">
                You scored {score} out of {questions.length}!
              </p>
              <p className="text-md mb-6">
                Completed in {Math.round(totalTime)} seconds!
              </p>
              <p className="text-md mb-6">
                {score === questions.length
                  ? "Perfect! You're a true expert on the couple!"
                  : score >= questions.length / 2
                  ? "Great job! You know the couple well!"
                  : "Nice try! Maybe chat with the couple more!"}
              </p>
              <div className="space-y-4 mb-6">
                <button
                  onClick={() => setLeaderboardType('mini')}
                  className={`w-full py-2 px-6 rounded-lg ${leaderboardType === 'mini' ? 'bg-amber-600 text-white' : (darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300')}`}
                >
                  View Mini Game Leaderboard
                </button>
                <button
                  onClick={() => setLeaderboardType('full')}
                  className={`w-full py-2 px-6 rounded-lg ${leaderboardType === 'full' ? 'bg-amber-600 text-white' : (darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300')}`}
                >
                  View Full Game Leaderboard
                </button>
                <div className="space-x-4">
                  <button
                    onClick={() => setLeaderboardView('top5')}
                    className={`py-2 px-4 rounded-lg ${leaderboardView === 'top5' ? 'bg-amber-600 text-white' : (darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300')}`}
                  >
                    Top 5
                  </button>
                  <button
                    onClick={() => setLeaderboardView('all')}
                    className={`py-2 px-4 rounded-lg ${leaderboardView === 'all' ? 'bg-amber-600 text-white' : (darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300')}`}
                  >
                    All
                  </button>
                </div>
              </div>
              {renderLeaderboards()}
              <button
                onClick={() => setGameState('mainMenu')}
                className={`w-full py-2 px-6 rounded-lg transition-colors ${darkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`}
              >
                🪴 Back to Main Menu
              </button>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<TriviaGame />);
  </script>
</body>
</html>
